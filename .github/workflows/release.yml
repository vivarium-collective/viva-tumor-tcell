name: Publish to PyPI

# Publishes viva-tumor-tcell to PyPI via OIDC Trusted Publishing (no API token).
# Triggered when a GitHub Release is published, so cutting a Release is the
# single action that ships a version.
#
# PREREQUISITE (one-time, human PyPI owner only — an agent cannot do this):
#   On https://pypi.org/manage/project/viva-tumor-tcell/settings/publishing/ add
#   a Trusted Publisher -> GitHub with:
#     owner:               vivarium-collective
#     repository:          viva-tumor-tcell
#     workflow filename:   release.yml
#     environment name:    pypi
#   The project does not exist on PyPI yet, so use the "pending publisher" form
#   at https://pypi.org/manage/account/publishing/ (same fields) to authorize the
#   first upload. Until that is configured PyPI-side, the publish step below fails.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # The dedicated environment the PyPI Trusted Publisher is scoped to.
    environment:
      name: pypi
      url: https://pypi.org/project/viva-tumor-tcell/
    permissions:
      # OIDC token for Trusted Publishing — this is what replaces an API token.
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # No `password:` — auth is OIDC Trusted Publishing.
        uses: pypa/gh-action-pypi-publish@v1.14.2
