# tumor-tcell-showcase/investigation.yaml — schema v2
schema_version: 2
name: tumor-tcell-showcase
title: "Tumor–T-cell Microenvironment (viva-munk port)"
created: '2026-09-08'
status: running

question: |
  Does the process-bigraph port of the tumor-tcell ABM — with viva-munk providing the
  collision physics — reproduce the paper's central finding, that IFNg-driven tumor
  phenotype transformation gates therapeutic T-cell efficacy, and that efficacy falls as
  the exhausted (PD1+) T-cell fraction rises?

hypothesis: |
  Active (PD1-) T cells in contact with tumor cells secrete IFNg and cytotoxic packets.
  IFNg diffuses and drives proliferative PDL1n tumors into the arrested, MHCI/PDL1-high
  PDL1p state, which in turn licenses stronger killing. Raising the starting PD1+ fraction
  (exhausted T cells) lowers IFNg output, conversion, and tumor suppression.

lead: |
  A faithful port of Hickey/Agmon et al. (Cell Systems): tumor and T cells as per-cell
  process-bigraph processes over a diffusing IFNg field, with cell–cell collisions and
  neighbor detection delegated to viva-munk's pymunk engine. Studies here run at a
  tractable scale (tens of cells, tens of simulated hours); each documents the parameters
  needed to reach the paper's full-scale figures (1200 cells, 3 days).

executive:
  what_is_this: |
    Three studies exercising the ported microenvironment: T-cell efficacy vs. PD1+ fraction,
    IFNg-driven phenotype conversion, and an in-vitro-style killing/cytotoxicity assay — each
    with an interactive population time-series and a spatial animation.
  verdict: "The port reproduces the paper's directional findings at tractable scale; full-scale quantitative calibration is future work."
  verdict_status: passing-with-caveats
  decisions_needed:
    - "Run the headline conditions at paper scale (1200 cells, 3 days) with replicate seeds on the mini?"
    - "Which directional readouts should become hard pass/fail gates once replicated?"

scientific_argument:
  main_claim: |
    The viva-munk-physics port recovers the paper's mechanism: active T cells drive IFNg-mediated
    PDL1n→PDL1p conversion and suppress tumor growth, and that suppression weakens as the PD1+
    (exhausted) T-cell fraction increases.
  evidence_for:
    - "T cells suppress net tumor growth vs. a matched no-T control (efficacy study)."
    - "Tumor suppression is greater at 25% PD1+ than at 75% PD1+ — the paper's efficacy-vs-exhaustion trend."
    - "PDL1p tumor fraction and IFNg field are higher with active T cells than without (conversion study)."
    - "T-cell exhaustion (PD1+ fraction) rises over time, faster when seeded with more PD1+ cells."
  evidence_against:
    - "Single-seed runs at reduced scale; outright killing (12800-packet threshold) is modest over tens of hours."
    - "Effect sizes are directional, not yet fit to the paper's quantitative cytotoxicity curves."
  key_figures:
    - "tcell-efficacy-pd1: tumor count over time across no-T / 25% PD1+ / 75% PD1+."
    - "phenotype-conversion: PDL1p fraction over time (with vs without T cells) + IFNg field animation."
  caveats:
    - "Scale/time reduced for tractability; replicate seeds + paper-scale runs needed for quantitative claims."

biological_story: |
  In the tumor microenvironment, cytotoxic T cells must both recognize and transform their
  targets. A T cell that engages a tumor cell secretes interferon-gamma; the cytokine
  diffuses through the tissue and pushes nearby proliferative tumor cells into an arrested
  state that displays more MHCI and PDL1. That transformed state is easier to kill but also
  more inhibitory — and a T cell that has been engaged too long becomes exhausted (PD1+),
  secreting less. The paper's claim is that this phenotype transformation, not raw T-cell
  numbers, is what determines whether the T cells clear the tumor. These studies reconstruct
  that loop from composable parts and show the same directional dependence on the PD1+ fraction.

at_a_glance:
  - {study: tcell-efficacy-pd1, role: "Headline: tumor suppression falls as the PD1+ (exhausted) T-cell fraction rises."}
  - {study: phenotype-conversion, role: "IFNg from active T cells drives PDL1n→PDL1p tumor conversion."}
  - {study: killing-assay-cytotoxicity, role: "Well-mixed cytotoxicity vs. a matched no-T control."}

studies:
  - tcell-efficacy-pd1
  - phenotype-conversion
  - killing-assay-cytotoxicity

acceptance_criteria:
  - {study: tcell-efficacy-pd1, behavior: "T cells suppress tumor growth, and 25% PD1+ suppresses more than 75% PD1+."}
  - {study: phenotype-conversion, behavior: "PDL1p tumor fraction and IFNg are higher with active T cells than without."}
  - {study: killing-assay-cytotoxicity, behavior: "Cytotoxicity (net tumor reduction vs control) is positive with T cells present."}
