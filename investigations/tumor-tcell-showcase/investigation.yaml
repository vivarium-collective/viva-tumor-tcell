  - tumor-microenvironment
  - tcell-exhaustion
  - phenotype-conversion
  - killing-assay-cytotoxicity
  - efficacy-at-scale

acceptance_criteria:
  - {study: tumor-microenvironment, behavior: "The headline experiment reproduces tumor-tcell's full analysis figure suite (population/division/death/snapshots/video) with the paper's colors."}
  - {study: tcell-exhaustion, behavior: "Exhausted (PD1+) fraction with 75% PD1+ start exceeds 25% PD1+ start (mean over seeds)."}
  - {study: phenotype-conversion, behavior: "Active T cells secrete a measurable IFNg field in every seed; none without T cells."}
  - {study: killing-assay-cytotoxicity, behavior: "Mean cytotoxicity (net tumor reduction vs control) is positive across seeds."}
  - {study: efficacy-at-scale, behavior: "At 150 cells/1500 ticks, active (25% PD1+) T cells suppress tumor growth more than exhausted (75% PD1+) in every seed."}
