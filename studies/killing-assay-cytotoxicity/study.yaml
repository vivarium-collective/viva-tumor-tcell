# killing-assay-cytotoxicity/study.yaml — schema v4
schema_version: 4
name: killing-assay-cytotoxicity
title: "In-vitro-style killing / cytotoxicity assay"
created: '2026-09-08'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  In a well-mixed assay, do active T cells produce net tumor cell death (positive
  cytotoxicity) relative to a matched no-T control?

study_card:
  goal: "Reproduce the paper's in-vitro killing readout: cytotoxicity vs. a matched control."
  mechanism: "Well-mixed tumor cells (50% PDL1+, MHCI-high) + active T cells (25% PD1+). Cytotoxicity = (control - experiment)/control x 100 on final tumor count."
  expected_result: "Fewer tumor cells with T cells than in the no-T control (positive cytotoxicity)."
  main_expert_question: "How does cytotoxicity scale with the T:tumor ratio and PDL1+ fraction toward the paper's dose curves?"

biological_summary: |
  Mimicking the paper's cytotoxicity assay, tumor cells were co-cultured with active T
  cells at a 1.5:1 T:tumor ratio; a matched well received no T cells. With T cells present
  the final tumor count is reduced by 25% relative to control — positive cytotoxicity from
  cumulative cytotoxic-packet delivery to MHCI-high (PDL1p) tumors.

expected_behavior:
  - name: positive_cytotoxicity
    en: "Net tumor reduction vs. the matched no-T control is positive."
    measure: "cytotoxicity = (control_final - experiment_final)/control_final x 100"
    expect: "cytotoxicity > 0"

behavior_tests:
  - name: positive_cytotoxicity
    measure: "final tumor count with T cells vs matched no-T control"
    expect: "cytotoxicity > 0"
    result: "PASS (single seed): +T=30, control=40 -> cytotoxicity 25%"

report:
  title: "Killing / cytotoxicity assay"
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: directional
  objective: "Show positive T-cell cytotoxicity vs. a matched control."
  conclusion: |
    With a 1.5:1 T:tumor ratio against 50% PDL1+ tumors, active T cells reduce the final
    tumor count by 25% relative to the no-T control — positive cytotoxicity.
  caveat: |
    Single seed at reduced scale; a T:tumor-ratio and PDL1+-fraction sweep with replicates
    is needed to reproduce the paper's quantitative cytotoxicity dose curves.

readouts:
  - "tumor count over time (+T vs control)"
  - "cytotoxicity % vs matched control"

canonical_runs:
  - name: killing-vs-control
    script: studies/killing-assay-cytotoxicity/sims/run.py

visualizations:
  - {name: tumor_count_vs_control, path: viz/tumor_count_vs_control.html}
  - {name: spatial_killing, path: viz/spatial_killing.html}

baseline:
  - name: baseline
    composite: viva_tumor_tcell.composites.microenvironment.killing_assay
    params: {n_tumors: 30, tumor_t_ratio: 1.5, pdl1_positive_frac: 0.5, pd1_positive_frac: 0.25}
