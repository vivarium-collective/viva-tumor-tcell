# killing-assay-cytotoxicity/study.yaml — schema v4
schema_version: 4
name: killing-assay-cytotoxicity
title: "In-vitro-style killing / cytotoxicity assay"
created: '2026-09-08'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  In a well-mixed assay, do active T cells produce net tumor cell death (positive
  cytotoxicity) relative to a matched no-T control, robustly across seeds?

study_card:
  goal: "Reproduce the paper's in-vitro killing readout: positive cytotoxicity vs. a matched control."
  mechanism: "Well-mixed tumor cells (50% PDL1+, MHCI-high) + active T cells (25% PD1+, 1.5:1 ratio). Cytotoxicity = (control - experiment)/control x 100 on final tumor count, paired per seed."
  expected_result: "Fewer tumor cells with T cells than in the no-T control (positive mean cytotoxicity)."
  main_expert_question: "How does cytotoxicity scale with the T:tumor ratio and PDL1+ fraction toward the paper's dose curves?"

biological_summary: |
  This mirrors the paper's in-vitro cytotoxicity assay (Hickey, Agmon et al., Cell Systems
  2024, Figure 2). There, PMEL-activated CD8+ T cells were co-cultured 1:1 with B16-F10
  melanoma cells that were either untreated or IFNg-pretreated; the IFNg-pretreated (PDL1+,
  MHC-I-high) tumors were killed far more effectively (~50% vs ~7% cytotoxicity at 13 h), and
  the multiscale model reproduced this (~60% cytotoxicity by 12 h, mean of n=5 ± SEM), where
  cytotoxicity = (control − experiment)/control × 100. Here, tumor cells (50% PDL1+) were
  co-cultured with active T cells (25% PD1+) at a 1.5:1 ratio with a matched no-T control
  across 6 seeds; mean cytotoxicity was positive (~11% ± 8, positive in 5/6 seeds) — net
  killing from cumulative cytotoxic-packet delivery to MHC-I-high tumors. The dense, high-ratio
  well-mixed layout gives enough sustained contact for killing to register, unlike the sparser
  spatial microenvironment.

expected_behavior:
  - name: positive_cytotoxicity
    en: "Mean net tumor reduction vs. the matched no-T control is positive."
    measure:
      kind: scalar
      of: "cytotoxicity = (control_final - experiment_final)/control_final x 100, mean over seeds"
    expect:
      op: positive
      of: "mean cytotoxicity > 0"

behavior_tests:
  - name: positive_cytotoxicity
    measure:
      kind: scalar
      of: "paired cytotoxicity % across 6 seeds"
    expect:
      op: positive
      of: "mean cytotoxicity > 0"
    result: "PASS: cytotoxicity ~11 ± 8% (positive in 5/6 seeds)"

report:
  title: "Killing / cytotoxicity assay"
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: replicated
  objective: "Show positive, replicated T-cell cytotoxicity vs. a matched control."
  conclusion: |
    With a 1.5:1 T:tumor ratio against 50% PDL1+ tumors, active T cells reduce the final tumor
    count relative to the no-T control by ~11% on average (positive in 5/6 seeds).
  caveat: |
    Single ratio / PDL1+ fraction and reduced scale; a ratio + PDL1+ sweep with more replicates
    is needed to reproduce the paper's quantitative cytotoxicity dose curves.

readouts:
  - "tumor count over time (+T vs control), mean ± std"
  - "paired cytotoxicity % across seeds"

canonical_runs:
  - name: killing-vs-control
    script: studies/killing-assay-cytotoxicity/sims/run.py

visualizations:
  - {name: tumor_count_vs_control, path: viz/tumor_count_vs_control.html}
  - {name: population_tumor, path: viz/population_tumor.html}
  - {name: deaths, path: viz/deaths.html}
  - {name: spatial_gif, path: viz/spatial_gif.html}
  - {name: spatial_killing, path: viz/spatial_killing.html}

baseline:
  - name: baseline
    composite: viva_tumor_tcell.composites.microenvironment.killing_assay
    params: {n_tumors: 30, tumor_t_ratio: 1.5, pdl1_positive_frac: 0.5, pd1_positive_frac: 0.25}
