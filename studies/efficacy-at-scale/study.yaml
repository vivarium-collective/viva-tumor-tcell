# efficacy-at-scale/study.yaml — schema v4
schema_version: 4
name: efficacy-at-scale
title: "T-cell efficacy vs. PD1+ fraction, at larger scale"
created: '2026-09-08'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Does the paper's efficacy-vs-exhaustion ordering — active (25% PD1+) T cells suppress
  tumor growth more than exhausted (75% PD1+) T cells — emerge when the simulation is scaled
  up from the tractable 40-cell / 600-tick studies?

study_card:
  goal: "Show the population efficacy claim that was noise-limited at tractable scale resolving with more cells + time."
  mechanism: "Three conditions (no-T / 25% PD1+ / 75% PD1+) at 150 tumors, 1500 ticks (25 h), 3 seeds. Active T cells convert tumors (IFNg) and kill; exhausted T cells do neither."
  expected_result: "25% PD1+ suppresses tumor count more than 75% PD1+ in every seed; conversion (PDL1p) far higher with active T cells."
  main_expert_question: "Does the ordering hold with more replicates and at the paper's full scale (1200 cells, 3 days)?"

biological_summary: |
  This is the ported analogue of the paper's Figure 3E result (Hickey, Agmon et al., Cell
  Systems 2024). At paper scale (1,200 tumor + 12 T cells, 3 days) the paper found 25% PD1+
  T cells hold the tumor to ~1,000 cells vs ~3,000 (75% PD1+) vs ~5,000 (no T) at 60 h —
  crucially, driven by the RATE of tumor phenotype conversion, not the kill count (the two
  T-cell conditions produced a nearly identical ~1,300 vs ~1,200 deaths). At 150 cells and
  1500 ticks (vs. 40/600 in the tractable studies) the same ordering appears here: active
  (25% PD1+) T cells suppressed tumor growth (285 ± 15 tumors vs. 315 ± 24 no-T) while
  exhausted (75% PD1+) T cells did not (335 ± 11). The ordering held in all 3 seeds vs. only
  3/6 at the tractable scale — the effect was real but under-powered, not absent. Conversion
  tracked it: PDL1p reached 14–42% with active T cells vs. 5–9% (exhausted) and 3–5% (no T).

expected_behavior:
  - name: efficacy_ordering_at_scale
    en: "Active (25% PD1+) T cells suppress tumor growth more than exhausted (75% PD1+) T cells, in every seed."
    measure:
      kind: scalar
      of: "final tumor count per condition; suppression = (no-T mean - condition)/no-T mean"
    expect:
      op: greater_than
      of: "suppression(25% PD1+) > suppression(75% PD1+) in all seeds"

behavior_tests:
  - name: efficacy_ordering_at_scale
    measure:
      kind: scalar
      of: "per-seed suppression, 25% vs 75% PD1+ (150 cells, 1500 ticks, 3 seeds)"
    expect:
      op: greater_than
      of: "25% PD1+ suppresses more than 75% PD1+ in 3/3 seeds"
    result: "PASS: ordering 3/3; suppression 25% = +8.7±8.9%, 75% = -7.0±6.6%"

report:
  title: "T-cell efficacy at larger scale"
  verdict: passing
  confidence: medium
  evidence_quality: replicated
  objective: "Show the paper's efficacy-vs-exhaustion ordering emerging with scale."
  conclusion: |
    Scaling to 150 cells / 1500 ticks resolves the population efficacy claim that was lost in
    growth noise at 40/600: active T cells suppress tumor growth more than exhausted ones in
    3/3 seeds, with the expected IFNg / conversion gradient. The port reproduces the paper's
    central finding; the tractable studies were simply under-powered.
  caveat: |
    3 seeds at 150 cells / 25 h — an intermediate scale, not the paper's full 1200 cells /
    3 days. Suppression magnitude (~9%) and its variance argue for the full-scale run (a mini/
    overnight job via scripts/scale_efficacy.py) to tighten the quantitative claim.

readouts:
  - "tumor count over time per condition (mean ± std)"
  - "suppression % (25% vs 75% PD1+); per-seed ordering"

canonical_runs:
  # Heavy sim (~30 min CPU) writes reports/scale_efficacy_results.json:
  #   python scripts/scale_efficacy.py 150 40 1500 600 60 3
  # This runner renders the figure + verdict from that committed data.
  - name: render-efficacy-at-scale
    script: studies/efficacy-at-scale/sims/run.py

visualizations:
  - {name: tumor_count_at_scale, path: viz/tumor_count_at_scale.html}

baseline:
  - name: baseline
    composite: viva_tumor_tcell.composites.microenvironment.tumor_microenvironment
    params: {n_tumors: 150, n_tcells: 40, pd1_positive_frac: 0.25}
