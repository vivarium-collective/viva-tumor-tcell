# tcell-efficacy-pd1/study.yaml — schema v4
schema_version: 4
name: tcell-efficacy-pd1
title: "T-cell efficacy vs. PD1+ (exhausted) fraction"
created: '2026-09-08'
status: complete
design_status: complete
implementation_status: complete
simulation_status: ran
phase: Evaluate

question: |
  Do active (PD1-) T cells suppress tumor growth, and does suppression weaken as the
  starting PD1+ (exhausted) T-cell fraction rises?

study_card:
  goal: "Reproduce the paper's headline: therapeutic efficacy falls with T-cell exhaustion."
  mechanism: "CODEX layout (tumor mass + T-cell ring). Active T cells kill on contact and secrete IFNg; exhausted (PD1+) T cells secrete less and die faster."
  expected_result: "no-T control grows most; 25% PD1+ suppresses tumor count more than 75% PD1+."
  main_expert_question: "Do these directional effects hold under replicate seeds and at paper scale (1200 cells, 3 days)?"

biological_summary: |
  T cells were seeded in a ring around a central tumor mass and allowed to migrate in,
  engage tumor cells, secrete IFNg and cytotoxic packets, and (for PD1+ cells) become
  exhausted. With no T cells the tumor grows unchecked; with active (mostly PD1-) T cells
  it is suppressed; with mostly exhausted (PD1+) T cells the suppression is weaker — the
  paper's central efficacy-vs-exhaustion trend.

expected_behavior:
  - name: efficacy_falls_with_exhaustion
    en: "T cells suppress tumor growth relative to a no-T control, and 25% PD1+ suppresses at least as much as 75% PD1+."
    measure: "final tumor count per condition; suppression = (control - condition)/control"
    expect: "suppression(25% PD1+) > 0 and >= suppression(75% PD1+)"

behavior_tests:
  - name: efficacy_falls_with_exhaustion
    measure: "final tumor count (no-T / 25% PD1+ / 75% PD1+)"
    expect: "suppression_25 > 0 and suppression_25 >= suppression_75"
    result: "PASS (single seed): no-T=59, 25%=51 (13.6%), 75%=53 (10.2%)"

report:
  title: "T-cell efficacy vs. PD1+ fraction"
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: directional
  objective: "Show tumor suppression and its dependence on the exhausted T-cell fraction."
  conclusion: |
    All three conditions run end to end and reproduce the directional finding: T cells
    suppress tumor growth, and suppression is greater at 25% PD1+ than at 75% PD1+.
  caveat: |
    Single seed at reduced scale (40 tumors, 12 T cells, 10 h). Replicate seeds and a
    paper-scale run (1200 cells, 3 days) are needed for a quantitative claim.

readouts:
  - "tumor count over time, per condition"
  - "suppression % vs no-T control"

canonical_runs:
  - name: efficacy-3-conditions
    script: studies/tcell-efficacy-pd1/sims/run.py

visualizations:
  - {name: tumor_count_by_condition, path: viz/tumor_count_by_condition.html}
  - {name: spatial_25pct, path: viz/spatial_25pct.html}

baseline:
  - name: baseline
    composite: viva_tumor_tcell.composites.microenvironment.tumor_microenvironment
    params: {n_tumors: 40, n_tcells: 12, pd1_positive_frac: 0.25}
