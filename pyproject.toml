[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-tumor-tcell"
version = "0.1.0"
description = "Process-bigraph port of the tumor-tcell tumor-microenvironment ABM (viva-munk physics)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph",
    "viva-munk",
    "numpy",
    "scipy",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-tumor-tcell"
Issues = "https://github.com/vivarium-collective/viva-tumor-tcell/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_tumor_tcell"]
